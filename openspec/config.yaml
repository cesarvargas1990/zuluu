schema: spec-driven

context: |
  Proyecto: ZULU ADMIN · Majagua Digital (administración de condominios, multi-tenant).
  Requisitos: docs/requirements/especificaciones.md (PDF original en la misma carpeta).
  Tech stack: pnpm monorepo, Node 22, NestJS 11 + Prisma 6 + PostgreSQL 17 (apps/api), React + Vite + TS (apps/web), packages/shared.
  Architecture: monolito modular (un módulo Nest por M01–M10), RLS por condominio_id con rol zulu_app y prisma.withTenant().
  Testing: Vitest (unit src/**/*.spec.ts; integración apps/api/test/*.int.spec.ts contra Postgres real).
  Style: TypeScript strict, ESLint 9 + typescript-eslint, Prettier; dominio y UI en español.

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules (M01–M10) and packages (api, web, shared)
    - Reference the spec section (§) and use cases (CU-xx) covered
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Every spec touching condominium data MUST include a cross-tenant isolation scenario
    - Write specs in Spanish
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Declare new tables, RLS policies, grants and audit events (skill prisma-tenant-table)
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load project skills zulu-domain, nest-module, prisma-tenant-table as relevant
  verify:
    - Run pnpm typecheck, pnpm lint, pnpm test and pnpm --filter @zulu/api test:integration
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  detected: 2026-11-09
  strict_tdd: true
  runner: { framework: vitest, command: pnpm test }
  layers:
    unit: { available: true, tool: vitest }
    integration:
      { available: true, tool: 'vitest + PostgreSQL (pnpm --filter @zulu/api test:integration)' }
    e2e: { available: false, tool: '— (planned: playwright)' }
  coverage: { available: false, command: '— (add @vitest/coverage-v8)' }
  quality:
    linter: { available: true, command: pnpm lint }
    type_checker: { available: true, command: pnpm typecheck }
    formatter: { available: true, command: pnpm format:check }
